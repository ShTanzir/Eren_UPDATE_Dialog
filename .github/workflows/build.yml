name: Build Eren & Eren Admin

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # CRITICAL FIX: do NOT install the removed "tools" package.
      # Default of setup-android@v3 includes "tools" which fails on current SDK.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Eren (Dialog) APK
        working-directory: Eren
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Eren Admin APK
        working-directory: ErenAdmin
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Eren APK
        uses: actions/upload-artifact@v4
        with:
          name: Eren-Dialog-APK
          path: Eren/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Eren Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Eren-Admin-APK
          path: ErenAdmin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
