name: Build Eren & Eren Admin

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          chmod +x Eren/gradlew || true
          chmod +x ErenAdmin/gradlew || true

      - name: Build Eren (Dialog) APK
        working-directory: Eren
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Build Eren Admin APK
        working-directory: ErenAdmin
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload Eren APK
        uses: actions/upload-artifact@v4
        with:
          name: Eren-Dialog-APK
          path: Eren/app/build/outputs/apk/release/*.apk

      - name: Upload Eren Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Eren-Admin-APK
          path: ErenAdmin/app/build/outputs/apk/release/*.apk
