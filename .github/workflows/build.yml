name: Build Eren Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build both APKs
        run: |
          gradle :eren-dialog:assembleRelease :eren-dialog:assembleDebug :eren-admin:assembleRelease :eren-admin:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: eren-apks
          path: |
            eren-dialog/build/outputs/apk/debug/*.apk
            eren-dialog/build/outputs/apk/release/*.apk
            eren-admin/build/outputs/apk/debug/*.apk
            eren-admin/build/outputs/apk/release/*.apk
