plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eren.dialog'
    compileSdk 36

    defaultConfig {
        applicationId 'com.eren.dialog'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
